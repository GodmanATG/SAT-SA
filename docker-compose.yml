version: '3.8'

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: satsa
      POSTGRES_PASSWORD: satsa
      POSTGRES_DB: satsa
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://satsa:satsa@db:5432/satsa
    depends_on:
      - db

volumes:
  postgres_data:
